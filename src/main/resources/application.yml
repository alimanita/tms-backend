spring:
  application:
    name: tms-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:ali08621568}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: true
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

tms:
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBobWFjU0hBMzg0LWF0LWxlYXN0LTM4NC1iaXRzLWxvbmcx}
  access-token-expiration-ms: ${JWT_EXPIRATION:604800000} # 7 jours (604800000 ms) au lieu de 30 min (1800000 ms)
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 jours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.transport.tms: DEBUG
    org.hibernate.SQL: DEBUG